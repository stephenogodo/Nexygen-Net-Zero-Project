name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  pipeline-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-train.txt

      - name: Install training dependencies
        run: pip install -r requirements-train.txt

      - name: Run data prep pipeline
        run: python pipeline/data_prep_pipeline.py --input data/ESG_Data.csv --output /tmp/processed

      - name: Run EDA report
        run: python pipeline/eda_report.py --input data/ESG_Data.csv --output /tmp/reports

      - name: Verify EDA outputs were produced
        run: |
          test -f /tmp/reports/trends.png
          test -f /tmp/reports/seasonality.png
          test -f /tmp/reports/anomalies.png
          test -f /tmp/reports/driver_importance.png
          test -f /tmp/reports/findings.md
          echo "EDA report outputs present"

      - name: Run training pipeline (known-good hyperparameters, no search)
        run: python pipeline/train_pipeline.py --input data/ESG_Data.csv --output /tmp/models

      - name: Verify a model was selected for each scope
        run: |
          python -c "
          import json
          with open('/tmp/models/model_manifest.json') as f:
              manifest = json.load(f)
          for scope, info in manifest['scopes'].items():
              assert info['model_type'] in ('sarima', 'prophet'), scope
              assert info['metrics']['r2'] > 0, scope
              print(scope, '->', info['model_type'], 'R2=', info['metrics']['r2'])
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nexygen-backend:ci ./backend

      - name: Build frontend image
        run: docker build -f ./frontend/dockerfile.streamlit -t nexygen-frontend:ci ./frontend

      - name: Smoke test backend image
        run: |
          docker run -d --name backend-ci -p 8000:8000 nexygen-backend:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend healthy"
              curl -s http://localhost:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker logs backend-ci
          exit 1
